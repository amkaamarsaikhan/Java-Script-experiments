<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>tooluur</title>
    <link rel="icon" href="images/js-favicon.png">
    <style>
        :root {
            --main-bg: oklch(100% 0 0);
            --main-text: oklch(32.1% 0.043 250.7);
            --accent-color: oklch(65.8% 0.147 248.8);
            --card-bg: oklch(98.1% 0.003 247.9);
            --border-color: oklch(90% 0.01 250);
        }

        .dark-theme {
            --main-bg: oklch(22.6% 0 0);
            --main-text: oklch(95.5% 0.009 224.2);
            --accent-color: oklch(56.3% 0.122 249.2);
            --card-bg: oklch(28.4% 0 0);
            --border-color: oklch(40% 0.01 224.2);
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--main-bg);
            color: var(--main-text);
            transition: background-color 0.3s, color 0.3s;
            margin:10px;
            padding: 100px 20px 40px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }


        button {
            padding: 10px 16px;
            border-radius: 20px;
            border: 1px solid var(--accent-color);
            background: var(--accent-color);
            color: var(--main-bg);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            box-shadow: 0 0 15px var(--accent-color);
            transition: all 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }


        .counter-container {
            text-align: center;
            margin-top: 50px;
        }
    </style>
</head>

<body>
    <div class="counter-container">
        <h1 id="count-display">0</h1>
        <button id="decrement-btn">hasah</button>
        <button id="reset-btn">sergeeh</button>
        <button id="increment-btn">nemeh</button>
    </div>
    <script src="header.js"></script>
    <script>
        let count = 0;

        const counter = document.getElementById("count-display");
        const incrementBtn = document.getElementById("increment-btn");
        const decrementBtn = document.getElementById("decrement-btn");
        const resetBtn = document.getElementById("reset-btn");

        function updateCounter() {
            counter.textContent = count;
        }

        incrementBtn.addEventListener("click", () => {
            count++;
            updateCounter();
        });

        decrementBtn.addEventListener("click", () => {
            count--;
            updateCounter();
        });

        resetBtn.addEventListener("click", () => {
            count = 0;
            updateCounter();
        });

    </script>
</body>

</html>
