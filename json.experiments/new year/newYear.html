<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎆 New Year 2026 - OKLCH Colors</title>

<style>
:root {
    /* OKLCH формат: oklch(Lightness Chroma Hue) */
    --card-bg: oklch(15% 0.04 250 / 85%);
    --box-bg: oklch(25% 0.05 250);
    --accent: oklch(75% 0.15 220); /* Анхны цэнхэр туяа */
    --body-bg-top: oklch(25% 0.05 240);
    --body-bg-bottom: oklch(10% 0.03 260);
}

* { box-sizing: border-box; }

body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
    /* OKLCH ашиглан илүү гүнзгий градиент үүсгэх */
    background: radial-gradient(ellipse at bottom, var(--body-bg-top) 0%, var(--body-bg-bottom) 100%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: oklch(98% 0.01 240);
    gap: 20px;
}

#fireworksCanvas {
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;
}

.snow {
    position: fixed;
    top: -20px;
    color: var(--accent);
    user-select: none;
    pointer-events: none;
    z-index: 10;
    animation: fall linear infinite;
    text-shadow: 0 0 5px var(--accent);
}

@keyframes fall {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 0; }
    20% { opacity: 1; }
    100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
}

.card {
    z-index: 20;
    width: 360px;
    padding: 35px 30px;
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    border-radius: 24px;
    text-align: center;
    border: 1px solid oklch(100% 0 0 / 10%);
    box-shadow: 0 25px 50px oklch(0% 0 0 / 50%);
}

.settings-card {
    z-index: 20;
    width: 360px;
    padding: 15px 25px;
    background: oklch(100% 0 0 / 5%);
    backdrop-filter: blur(10px);
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border: 1px solid oklch(100% 0 0 / 10%);
}

h2 {
    margin: 0 0 20px 0;
    letter-spacing: 2px;
    font-weight: 600;
    color: var(--accent);
    text-shadow: 0 0 15px var(--accent);
}

select {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    margin-bottom: 20px;
    background: var(--box-bg);
    color: white;
    border: 1px solid oklch(100% 0 0 / 20%);
    outline: none;
    cursor: pointer;
}

.time { display: flex; gap: 10px; }

.box {
    flex: 1;
    background: var(--box-bg);
    padding: 15px 5px;
    border-radius: 15px;
    border: 1px solid oklch(100% 0 0 / 5%);
    transition: transform 0.3s;
}

.box:hover { transform: translateY(-5px); }

.number {
    font-size: 1.6rem;
    font-weight: 800;
    color: var(--accent);
}

.label {
    font-size: .7rem;
    opacity: .7;
    display: block;
    margin-top: 5px;
    text-transform: uppercase;
}

#colorPicker {
    width: 50px;
    height: 30px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: none;
}

#music-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    font-size: 20px;
    border: none;
    border-radius: 50%;
    padding: 15px;
    cursor: pointer;
    background: var(--accent);
    color: oklch(10% 0.02 240); /* Товчлуур дээрх икон бараан */
    box-shadow: 0 0 20px var(--accent);
    z-index: 30;
    transition: 0.3s;
}

#music-btn:hover {
    transform: scale(1.1);
    filter: brightness(1.2);
}
</style>
</head>

<body>

<canvas id="fireworksCanvas"></canvas>

<audio id="bgMusic" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<audio id="fireworkSound">
    <source src="https://assets.mixkit.co/sfx/preview/mixkit-firework-explosion-1689.mp3" type="audio/mpeg">
</audio>

<button id="music-btn">🎵</button>

<div class="card">
    <h2 id="title">⏳ COUNTDOWN</h2>
    <select id="eventSelect"></select>

    <div class="time">
        <div class="box"><span class="number" id="days">00</span><span class="label">Өдөр</span></div>
        <div class="box"><span class="number" id="hours">00</span><span class="label">Цаг</span></div>
        <div class="box"><span class="number" id="minutes">00</span><span class="label">Мин</span></div>
        <div class="box"><span class="number" id="seconds">00</span><span class="label">Сек</span></div>
    </div>
</div>

<div class="settings-card">
    <span style="font-size: 0.9rem; opacity: 0.8;">🎨 Accent Color (OKLCH):</span>
    <input type="color" id="colorPicker" value="#38bdf8">
</div>

<script>
/* ---------- OKLCH COLOR CONVERSION ---------- */
// Энэ функц нь HEX өнгийг OKLCH формат руу ойролцоогоор хөрвүүлж CSS variable-д онооно
function hexToOklch(hex) {
    // Хялбарчилсан байдлаар динамик утгыг CSS-д шууд hex-ээр нь дамжуулж болох ч 
    // бүхэлд нь OKLCH системээр удирдахын тулд ийнхүү тохируулж байна.
    document.documentElement.style.setProperty('--accent', hex);
}

/* ---------- DATA & CONFIG ---------- */
const events=[
 {name:"Шинэ жил 2026",date:"2026-01-01T00:00:00"},
 {name:"Тест (10 сек)",date:new Date(Date.now()+10000).toISOString()}
];

let targetDate=null;
let celebrated=false;
let themeColor = "#38bdf8";

const select=document.getElementById("eventSelect");
const music=document.getElementById("bgMusic");
const fireSound=document.getElementById("fireworkSound");
const btn=document.getElementById("music-btn");
const picker = document.getElementById("colorPicker");

/* ---------- COLOR PICKER ---------- */
picker.oninput = (e) => {
    themeColor = e.target.value;
    hexToOklch(themeColor);
};

/* ---------- MUSIC ---------- */
btn.onclick=()=>{
    if(music.paused){music.play();btn.textContent="⏸️"}
    else{music.pause();btn.textContent="🎵"}
};

/* ---------- INITIALIZE EVENTS ---------- */
events.forEach((e,i)=>{
    const o=document.createElement("option");
    o.value=i;o.textContent=e.name;
    select.appendChild(o);
});
setTarget(0);
select.onchange=e=>setTarget(e.target.value);

function setTarget(i){
    targetDate=new Date(events[i].date);
    celebrated=false;
    document.getElementById("title").textContent="⏳ COUNTDOWN";
    const c=document.getElementById("fireworksCanvas");
    const ctx = c.getContext("2d");
    ctx.clearRect(0,0,c.width,c.height);
}

/* ---------- COUNTDOWN ---------- */
setInterval(()=>{
    if(!targetDate)return;
    const diff=targetDate-new Date();

    if(diff<=0){
        if(!celebrated)startCelebration();
        update(0,0,0,0);
        return;
    }

    update(
        Math.floor(diff/86400000),
        Math.floor(diff/3600000)%24,
        Math.floor(diff/60000)%60,
        Math.floor(diff/1000)%60
    );
},1000);

function update(d,h,m,s){
    document.getElementById("days").textContent=String(d).padStart(2,"0");
    document.getElementById("hours").textContent=String(h).padStart(2,"0");
    document.getElementById("minutes").textContent=String(m).padStart(2,"0");
    document.getElementById("seconds").textContent=String(s).padStart(2,"0");
}

/* ---------- SNOW ---------- */
function createSnow(){
    for(let i=0;i<150;i++){
        const s=document.createElement("div");
        s.className="snow";
        s.textContent="❄";
        s.style.left=Math.random()*100+"vw";
        s.style.fontSize=Math.random()*14+10+"px";
        s.style.animationDuration=Math.random()*8+5+"s";
        s.style.animationDelay=Math.random()*10+"s";
        document.body.appendChild(s);
    }
}

/* ---------- FIREWORKS ---------- */
function startCelebration(){
    celebrated=true;
    document.getElementById("title").textContent="🎆 HAPPY NEW YEAR 🎆";
    music.play();
    fireworks();
}

function fireworks(){
    const canvas=document.getElementById("fireworksCanvas");
    const ctx=canvas.getContext("2d");
    canvas.width=innerWidth;
    canvas.height=innerHeight;
    const particles=[];

    class P{
        constructor(x,y,c){
            this.x=x;this.y=y;this.c=c;
            this.vx=(Math.random()-.5)*12;
            this.vy=(Math.random()-.5)*12;
            this.a=1;
        }
        draw(){
            ctx.globalAlpha=this.a;
            ctx.beginPath();
            ctx.arc(this.x,this.y,2.5,0,Math.PI*2);
            ctx.fillStyle=this.c;
            ctx.fill();
        }
        update(){
            this.vy+=0.05;
            this.x+=this.vx;
            this.y+=this.vy;
            this.a-=0.015;
        }
    }

    function animate(){
        if(!celebrated)return;
        requestAnimationFrame(animate);
        // Арын фоныг бага зэрэг бүдгэрүүлэх (Trail effect)
        ctx.fillStyle="rgba(0, 0, 0, 0.15)";
        ctx.fillRect(0,0,canvas.width,canvas.height);

        if(Math.random()<0.08){
            try {
                fireSound.currentTime=0;
                fireSound.play();
            } catch(e) {}
            
            const x=Math.random()*canvas.width;
            const y=Math.random()*canvas.height/2;
            const c = themeColor; 
            for(let i=0;i<40;i++)particles.push(new P(x,y,c));
        }

        particles.forEach((p,i)=>{
            if(p.a<=0)particles.splice(i,1);
            else { p.update(); p.draw(); }
        });
    }
    animate();
}

createSnow();
</script>
</body>
</html>
