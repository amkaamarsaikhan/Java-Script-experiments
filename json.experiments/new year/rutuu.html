<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Color Picker Snow</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --bg-card: #252525;
      --text: #ffffff;
      --border: 1px solid #555;
      --snow-color: white;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    .card {
      background: var(--bg-card);
      color: var(--text);
      width: 360px;
      padding: 24px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,.5);
      z-index: 10;
    }

    input[type="color"] {
      width: 100%;
      height: 50px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      margin: 12px 0;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: var(--border);
      background: #1c1c1c;
      color: var(--text);
      text-align: center;
      font-size: 16px;
    }

    #preview {
      height: 100px;
      margin-top: 16px;
      border-radius: 10px;
      border: var(--border);
    }

    .value {
      margin-top: 14px;
      padding: 10px;
      border-radius: 10px;
      border: var(--border);
      font-size: 15px;
    }

    /* Snow */
    .snow {
      position: fixed;
      top: -10px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--snow-color);
      pointer-events: none;
      animation: fall linear infinite;
    }

    @keyframes fall {
      to {
        transform: translateY(100vh);
      }
    }
  </style>
</head>

<body>

  <div class="card">
    <h2>🎨 Color Picker</h2>

    <input type="color" id="picker" value="#ff0000">
    <input type="text" id="hex" placeholder="#ff0000">

    <div id="preview"></div>
    <div class="value" id="rgb">RGB: 255, 0, 0</div>
  </div>

  <script>
    // ---------- COLOR ----------
    const picker = document.getElementById("picker");
    const hexInput = document.getElementById("hex");
    const preview = document.getElementById("preview");
    const rgbText = document.getElementById("rgb");

    function hexToRgb(hex) {
      const m = hex.match(/^#([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i);
      if (!m) return null;
      return {
        r: parseInt(m[1], 16),
        g: parseInt(m[2], 16),
        b: parseInt(m[3], 16)
      };
    }

    function setColor(color) {
      preview.style.background = color;
      hexInput.value = color;
      document.documentElement.style.setProperty("--snow-color", color);

      const rgb = hexToRgb(color);
      if (rgb) {
        rgbText.textContent = `RGB: ${rgb.r}, ${rgb.g}, ${rgb.b}`;
      }
    }

    picker.addEventListener("input", e => setColor(e.target.value));
    hexInput.addEventListener("input", e => {
      if (/^#[0-9a-f]{6}$/i.test(e.target.value)) {
        picker.value = e.target.value;
        setColor(e.target.value);
      }
    });

    setColor(picker.value);

    // ---------- SNOW ----------
    const SNOW_COUNT = 150;

    for (let i = 0; i < SNOW_COUNT; i++) {
      const s = document.createElement("div");
      s.className = "snow";

      s.style.left = Math.random() * 100 + "vw";
      s.style.animationDuration = 8 + Math.random() * 20 + "s";
      s.style.opacity = Math.random();
      s.style.transform = `scale(${Math.random()})`;

      document.body.appendChild(s);
    }
  </script>

</body>
</html>
